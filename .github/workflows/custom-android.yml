
      - name: Preparar dependencias del motor
        shell: bash
        run: |
          set -euo pipefail

          haxelib setup "$HOME/haxelib"
          haxelib install lime --quiet

          if [[ -f "hmm.json" ]]; then
            haxelib install hmm --quiet
            haxelib run hmm install --quiet
          elif [[ -f "setup/Unix.sh" ]]; then
            chmod +x setup/Unix.sh
            bash setup/Unix.sh
          else
            echo "No hay hmm.json ni setup/Unix.sh."
            echo "Instalando las bibliotecas declaradas en Project.xml."

            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import subprocess

          root = ET.parse("Project.xml").getroot()
          libraries = {}

          for node in root.iter("haxelib"):
              name = node.get("name")
              version = node.get("version")
              if not name:
                  continue
              if node.get("if") and any(x in node.get("if").split() for x in ["linux", "desktop", "debug", "PROFILE_BUILD"]):
                  continue
              libraries[name] = version

          for name, version in libraries.items():
              command = ["haxelib", "install", name]
              if version:
                  command.append(version)
              print("Instalando:", " ".join(command), flush=True)
              subprocess.run(command, check=True)
          PY
          fi
