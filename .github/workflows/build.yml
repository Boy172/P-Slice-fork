on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      cachePath:
        required: true
        type: string
      cacheLibrariesPath:
        required: true
        type: string
      exportPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PSliceEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set XCode app
        if: inputs.os == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Restore Libraries for compilation
        id: load-lib-cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cacheLibrariesPath }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/
          restore-keys: |
            ${{ inputs.cacheLibrariesPath }}

      - name: Restore existing build cache for faster compilation
        id: load-cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/release/${{ inputs.exportPath }}/haxe/
            export/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            cache-build-${{ inputs.exportPath }}

      - name: Install libVLC
        if: inputs.exportPath == 'linux'
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Configure Android
        if: inputs.exportPath == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Remove Firebase from Lime Android template
        if: inputs.exportPath == 'android'
        run: |
          FILE=".haxelib/lime/git/templates/android/template/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Lime Android build.gradle template not found"
            exit 1
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".haxelib/lime/git/templates/android/template/app/build.gradle")
          text = path.read_text()

          text = re.sub(
              r"(?m)^[ \t]*apply plugin: ['\"]com\.google\.firebase\.crashlytics['\"][ \t]*\n?",
              "",
              text
          )

          text = re.sub(
              r"(?ms)^[ \t]*firebaseCrashlytics\s*\{.*?^[ \t]*\}[ \t]*\n?",
              "",
              text
          )

          path.write_text(text)
          print("Firebase Crashlytics configuration removed.")
          PY

          echo "=== Checking Firebase references ==="
          if grep -n -E 'firebaseCrashlytics|com.google.firebase.crashlytics' "$FILE"; then
            echo "ERROR: Firebase references still exist."
            exit 1
          else
            echo "No Firebase Crashlytics references found."
          fi

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Sign APK with the proper key
        if: inputs.exportPath == 'android'
        env:
          OUT_DIR: ./export/release/android/bin/app/build/outputs/apk/release/
          SIGNING_KEY: ${{ secrets.MIKOLKA_PASSWORD }}
          SIGNING_FILE: ${{ secrets.MIKOLKA_KEYSTORE }}
        run: |
          set -e

          echo "$SIGNING_FILE" | base64 --decode > key.keystore

          if [ ! -s key.keystore ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Checking keystore..."
          keytool -list -keystore key.keystore -storepass "$SIGNING_KEY"

          if [ ! -f "${OUT_DIR}PSliceEngine-release.apk" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mv "${OUT_DIR}PSliceEngine-release.apk" "${OUT_DIR}PSliceEngine-unsigned.apk"

          $ANDROID_HOME/build-tools/35.0.1/zipalign -P 16 -f -v 4 \
            "${OUT_DIR}PSliceEngine-unsigned.apk" \
            "${OUT_DIR}PSliceEngine-release.apk"

          $ANDROID_HOME/build-tools/35.0.1/apksigner sign \
            --ks key.keystore \
            --ks-key-alias pslice \
            --ks-pass "env:SIGNING_KEY" \
            --key-pass "env:SIGNING_KEY" \
            "${OUT_DIR}PSliceEngine-release.apk"

          $ANDROID_HOME/build-tools/35.0.1/apksigner verify \
            --verbose \
            "${OUT_DIR}PSliceEngine-release.apk"

          rm "${OUT_DIR}PSliceEngine-unsigned.apk"
          rm key.keystore

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error

      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            for (const cache of caches.data.actions_caches) {
              if (cache.key == "${{ inputs.cachePath }}") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }

      - name: Uploading new cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/release/${{ inputs.exportPath }}/haxe/
            export/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            ${{ inputs.cachePath }}
