
name: Install P-Slice Custom Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract package
        run: |
          unzip -o P-Slice-Custom-Workflow.zip -d .
          mkdir -p source
          cp -a custom/source/. source/

      - name: Stage files
        run: |
          git add custom/
          git add source/flixel/graphics/framebuffer/
          git add README-INSTALACION.txt

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install P-Slice custom source files"
          git push
