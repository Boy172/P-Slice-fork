name: Build Lime natives

on:
  workflow_dispatch:
    inputs:
      commit_result:
        description: Subir los ndll compilados a la rama
        type: boolean
        default: true

permissions:
  contents: write

env:
  HAXE_VERSION: 4.3.6
  HXCPP_COMMIT: 65b851f749a10c1df34f2ef55836bdec67ee81c2

jobs:
  linux:
    name: Linux64
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libmbedtls-dev libpng-dev libuv1-dev

      - name: Configurar Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Instalar librerias de Haxe
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
          haxelib setup "$HOME/haxelib"
          haxelib git hxcpp https://github.com/Psych-Slice/hxcpp.git $HXCPP_COMMIT --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Activar cache de hxcpp
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp" >> $GITHUB_ENV

      - name: Enlazar Lime del repositorio
        run: haxelib dev lime "$GITHUB_WORKSPACE/lime"

      - name: Compilar nativos de Linux64
        run: haxelib run lime rebuild linux -64 -release -nocolor -nocffi

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Linux64-NDLL
          path: |
            lime/ndll/Linux64/
            !**/.gitignore
          if-no-files-found: error

  windows:
    name: Windows64
    runs-on: windows-2022
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Instalar librerias de Haxe
        shell: pwsh
        run: |
          "HAXEPATH=$env:HAXE_STD_PATH/.." | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          haxelib setup "$env:USERPROFILE\haxelib"
          haxelib git hxcpp https://github.com/Psych-Slice/hxcpp.git $env:HXCPP_COMMIT --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Activar cache de hxcpp
        shell: pwsh
        run: '"HXCPP_COMPILE_CACHE=$env:USERPROFILE\.hxcpp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Enlazar Lime del repositorio
        shell: pwsh
        run: haxelib dev lime "$env:GITHUB_WORKSPACE\lime"

      - name: Compilar nativos de Windows64
        shell: pwsh
        run: haxelib run lime rebuild windows -64 -release -nocolor -nocffi

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Windows64-NDLL
          path: |
            lime/ndll/Windows64/
            !**/.gitignore
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configurar Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Instalar librerias de Haxe
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
          haxelib setup "$HOME/haxelib"
          haxelib git hxcpp https://github.com/Psych-Slice/hxcpp.git $HXCPP_COMMIT --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Activar cache de hxcpp
        run: echo "HXCPP_COMPILE_CACHE=$HOME/.hxcpp" >> $GITHUB_ENV

      - name: Enlazar y configurar Lime
        run: |
          haxelib dev lime "$GITHUB_WORKSPACE/lime"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}" -nocffi
          haxelib run lime config ANDROID_SETUP true -nocffi

      - name: Compilar nativos de Android
        run: haxelib run lime rebuild android -release -nocolor -nocffi

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Android-NDLL
          path: |
            lime/ndll/Android/
            !**/.gitignore
          if-no-files-found: error

  commit:
    name: Subir ndll a la rama
    needs: [linux, windows, android]
    if: ${{ inputs.commit_result }}
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Bajar Linux64
        uses: actions/download-artifact@v4
        with:
          name: Linux64-NDLL
          path: lime/ndll/Linux64

      - name: Bajar Windows64
        uses: actions/download-artifact@v4
        with:
          name: Windows64-NDLL
          path: lime/ndll/Windows64

      - name: Bajar Android
        uses: actions/download-artifact@v4
        with:
          name: Android-NDLL
          path: lime/ndll/Android

      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lime/ndll
          git commit -m "Add compiled Lime natives" || echo "Sin cambios"
          git push
